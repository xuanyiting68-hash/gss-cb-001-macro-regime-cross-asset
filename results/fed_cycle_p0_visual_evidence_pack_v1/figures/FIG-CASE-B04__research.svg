  <g id="axes_3">
   <g id="text_29">
    <text style="font-size: 7.2px; font-family: 'DejaVu Sans'; text-anchor: start" x="68.1696" y="355.325562" transform="rotate(-0 68.1696 355.325562)">[CONTEMPORANEOUS_POLICY_CONTEXT] 2001-01-03: Federal Reserve records describe the January 3, 2001 intermeeting 50 bp cut as occurring amid weakening sales and production, lower…</text>
   </g>
   <g id="text_30">
    <text style="font-size: 7.2px; font-family: 'DejaVu Sans'; text-anchor: start" x="68.1696" y="380.634607" transform="rotate(-0 68.1696 380.634607)">[RETROSPECTIVE_DATING] 2001-03_to_2001-11: NBER later dated the 2001 recession from the March 2001 peak to the November 2001 trough; the March peak was announced on 2001-11-26.</text>
   </g>
   <g id="text_31">
    <text style="font-size: 7.2px; font-family: 'DejaVu Sans'; text-anchor: start" x="68.1696" y="405.943652" transform="rotate(-0 68.1696 405.943652)">[POST_ANCHOR_SHOCK] 2001-09-11: Federal Reserve History describes the September 11 attacks as a major shock that created massive dislocations in U.S. financial…</text>
   </g>
   <g id="text_32">
    <text style="font-size: 7.3px; font-family: 'DejaVu Sans'; text-anchor: end" x="821.7504" y="424.036371" transform="rotate(-0 821.7504 424.036371)">9/11 = POST_ANCHOR_SHOCK; not part of Jan-2001 cut rationale</text>
   </g>
   <g id="text_33">
