   </g>
   <g id="text_2">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start" x="60.48" y="142.3296" transform="rotate(-0 60.48 142.3296)">Time class: RETROSPECTIVE_DATING</text>
   </g>
   <g id="text_3">
    <text style="font-size: 9.2px; font-family: 'DejaVu Sans'" transform="translate(60.48 184.513061)">NBER later dated the 2001 recession from the March 2001 peak to the November 2001 trough; the March peak</text>
    <text style="font-size: 9.2px; font-family: 'DejaVu Sans'" transform="translate(60.48 195.555577)">was announced on 2001-11-26.</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start" x="60.48" y="289.6992" transform="rotate(-0 60.48 289.6992)">Hindsight warning</text>
   </g>
   <g id="text_5">
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans'; text-anchor: start" x="60.48" y="316.493119" transform="rotate(-0 60.48 316.493119)">At the January 3 first cut, the later March recession peak and its NBER classification were not known.</text>
   </g>
   <g id="text_6">
    <text style="font-size: 7.8px; font-family: 'DejaVu Sans'; text-anchor: start" x="60.48" y="365.0976" transform="rotate(-0 60.48 365.0976)">Source: NBER — Business Cycle Dating Procedure: Frequently Asked Questions</text>
   </g>
   <g id="text_7">
    <text style="font-size: 6.8px; font-family: 'DejaVu Sans'; text-anchor: start" x="60.48" y="385.6608" transform="rotate(-0 60.48 385.6608)">https://www.nber.org/research/business-cycle-dating/business-cycle-dating-procedure-frequently-asked-questions</text>
   </g>
   <g id="text_8">
    <text style="font-size: 7.2px; font-family: 'DejaVu Sans'; text-anchor: start" x="60.48" y="413.0784" transform="rotate(-0 60.48 413.0784)">Allowed use: Use to show the difference between first-cut timing and later official recession dating.</text>
   </g>
