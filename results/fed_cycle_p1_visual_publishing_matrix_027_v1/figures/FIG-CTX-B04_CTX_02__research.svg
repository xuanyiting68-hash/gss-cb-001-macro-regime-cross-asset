  <g id="text_9">
   <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle" x="432" y="34.317188" transform="rotate(-0 432 34.317188)">B04 context — RETROSPECTIVE_DATING</text>
