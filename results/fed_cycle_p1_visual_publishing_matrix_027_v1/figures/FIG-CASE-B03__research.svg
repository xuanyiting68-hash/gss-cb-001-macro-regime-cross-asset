  <g id="text_31">
   <text style="font-size: 6.6px; font-family: 'DejaVu Sans'" transform="translate(17.28 490.808004)">Historical case chronology and path description only; not evidence that the policy action caused the asset path or that this case predicts the</text>
   <text style="font-size: 6.6px; font-family: 'DejaVu Sans'" transform="translate(17.28 498.729809)">current cycle.</text>
  </g>
