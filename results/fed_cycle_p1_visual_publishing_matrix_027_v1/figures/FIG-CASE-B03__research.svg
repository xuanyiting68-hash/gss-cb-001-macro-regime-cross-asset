  <g id="axes_3">
   <g id="text_25">
    <text style="font-size: 7.2px; font-family: 'DejaVu Sans'; text-anchor: start" x="68.1696" y="356.685714" transform="rotate(-0 68.1696 356.685714)">[CONTEMPORANEOUS_POLICY_CONTEXT] 1995-07-06: The July 1995 FOMC statement said inflationary pressures had receded after the tightening initiated in early 1994 and announced a modest…</text>
   </g>
   <g id="text_26">
    <text style="font-size: 7.2px; font-family: 'DejaVu Sans'; text-anchor: start" x="68.1696" y="378.329262" transform="rotate(-0 68.1696 378.329262)">[RETROSPECTIVE_DATING] 1994-1995: NBER's current chronology places the U.S. expansion between the March 1991 trough and March 2001 peak, so the 1994-95 case is not dated as…</text>
   </g>
   <g id="text_27">
    <text style="font-size: 7.2px; font-family: 'DejaVu Sans'; text-anchor: start" x="68.1696" y="399.97281" transform="rotate(-0 68.1696 399.97281)">[RETROSPECTIVE_EVENT_CONTEXT] 1994-1995: The Federal Reserve's historical materials page notes that the FOMC first announced meeting outcomes in February 1994 and in February 1995…</text>
   </g>
   <g id="text_28">
    <text style="font-size: 7.3px; font-family: 'DejaVu Sans'; text-anchor: end" x="821.7504" y="420.955161" transform="rotate(-0 821.7504 420.955161)">Retrospective no-recession classification is not a contemporaneous 'soft landing' forecast.</text>
   </g>
  </g>
