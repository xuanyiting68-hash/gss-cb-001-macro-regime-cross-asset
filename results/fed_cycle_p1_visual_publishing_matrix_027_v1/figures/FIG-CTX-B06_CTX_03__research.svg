  <g id="axes_1">
   <g id="text_1">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start" x="60.48" y="108.0576" transform="rotate(-0 60.48 108.0576)">Event / period: 2020-03</text>
   </g>
   <g id="text_2">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start" x="60.48" y="142.3296" transform="rotate(-0 60.48 142.3296)">Time class: POST_ANCHOR_SHOCK</text>
   </g>
   <g id="text_3">
    <text style="font-size: 9.2px; font-family: 'DejaVu Sans'" transform="translate(60.48 184.513061)">In March 2020 the Federal Reserve explicitly said the coronavirus outbreak had disrupted economic</text>
    <text style="font-size: 9.2px; font-family: 'DejaVu Sans'" transform="translate(60.48 195.555577)">activity and financial conditions and posed sharply increased downside risks, leading to emergency easing</text>
    <text style="font-size: 9.2px; font-family: 'DejaVu Sans'" transform="translate(60.48 206.598092)">to the effective lower bound.</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start" x="60.48" y="289.6992" transform="rotate(-0 60.48 289.6992)">Hindsight warning</text>
   </g>
   <g id="text_5">
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans'; text-anchor: start" x="60.48" y="316.493119" transform="rotate(-0 60.48 316.493119)">COVID-19 was a later shock and must not be inserted into the July 2019 first-cut rationale.</text>
   </g>
   <g id="text_6">
    <text style="font-size: 7.8px; font-family: 'DejaVu Sans'; text-anchor: start" x="60.48" y="365.0976" transform="rotate(-0 60.48 365.0976)">Source: Federal Reserve Board — FOMC statement and minutes, March 15 2020</text>
   </g>
   <g id="text_7">
    <text style="font-size: 6.8px; font-family: 'DejaVu Sans'" transform="translate(60.48 377.498941)">https://www.federalreserve.gov/newsevents/pressreleases/monetary20200315a.htm |</text>
    <text style="font-size: 6.8px; font-family: 'DejaVu Sans'" transform="translate(60.48 385.6608)">https://www.federalreserve.gov/monetarypolicy/fomcminutes20200315.htm</text>
   </g>
   <g id="text_8">
    <text style="font-size: 7.2px; font-family: 'DejaVu Sans'; text-anchor: start" x="60.48" y="413.0784" transform="rotate(-0 60.48 413.0784)">Allowed use: Use to explain why the 12-month post-July-2019 market path includes a qualitatively new shock.</text>
   </g>
  </g>
  <g id="text_9">
   <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle" x="432" y="34.317188" transform="rotate(-0 432 34.317188)">B06 context — POST_ANCHOR_SHOCK</text>
  </g>
  <g id="text_10">
   <text style="font-size: 7.2px; font-family: 'DejaVu Sans'; text-anchor: start" x="17.28" y="489.670313" transform="rotate(-0 17.28 489.670313)">FIG-CTX-B06_CTX_03 | Claims: CLM-CTX-B06_CTX_03</text>
  </g>
  <g id="text_11">
   <text style="font-size: 6.6px; font-family: 'DejaVu Sans'; text-anchor: start" x="17.28" y="499.390453" transform="rotate(-0 17.28 499.390453)">Context timing must be preserved: retrospective dating and post-anchor shocks were not necessarily known at the earlier policy anchor.</text>
