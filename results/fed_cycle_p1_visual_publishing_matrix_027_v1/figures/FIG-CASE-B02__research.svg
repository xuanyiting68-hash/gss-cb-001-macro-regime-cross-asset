    <text style="font-size: 7.3px; font-family: 'DejaVu Sans'; text-anchor: start" x="76.7232" y="332.508782" transform="rotate(-0 76.7232 332.508782)">[RETROSPECTIVE_EVENT_CONTEXT] 1987-10-19: Federal Reserve History records Black Monday on 1987-10-19, when the DJIA fell 22.6% in one session amid a global market crash.</text>
