   <g id="text_23">
    <text style="font-size: 7.3px; font-family: 'DejaVu Sans'; text-anchor: start" x="76.7232" y="360.495321" transform="rotate(-0 76.7232 360.495321)">[RETROSPECTIVE_EVENT_CONTEXT] 1987-10-20: Federal Reserve History records the Fed's public readiness to provide liquidity after Black Monday and describes operational efforts to support…</text>
