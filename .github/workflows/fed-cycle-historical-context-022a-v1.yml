name: fed-cycle-historical-context-022a-v1
on:
  push:
    branches: [main]
    paths:
      - "research/FED_CYCLE_HISTORICAL_CONTEXT_022A_LOCK.md"
      - "research/FED_CYCLE_HISTORICAL_CONTEXT_022A_CLAIMS.csv"
      - "scripts/run_fed_cycle_historical_context_022a_v1.py"
      - "results/fed_cycle_historical_casebook_v1/CASEBOOK_EPISODES.csv"
      - "results/fed_cycle_historical_casebook_v1/QC.json"
      - ".github/workflows/fed-cycle-historical-context-022a-v1.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate-context:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pandas
      - run: python scripts/run_fed_cycle_historical_context_022a_v1.py
      - name: Commit 022A outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/fed_cycle_historical_context_022a_v1
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Run FED-CYCLE-HISTORICAL-CONTEXT-022A [skip ci]"
          git pull --rebase origin main
          git push
