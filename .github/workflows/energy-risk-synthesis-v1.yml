name: energy-risk-synthesis-v1

on:
  push:
    branches: [main]
    paths:
      - "research/ENERGY_RISK_SYNTHESIS_007_LOCK.md"
      - "scripts/run_energy_risk_synthesis_v1.py"
      - "results/energy_weekly_prospective_v1/PROSPECTIVE_EVENT_REGISTRY.csv"
      - "results/energy_weekly_state_veto_diag_v1/QC.json"
      - "results/energy_portwatch_v1/EXTERNAL_CONTEXT_SNAPSHOT.csv"
      - ".github/workflows/energy-risk-synthesis-v1.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  synthesize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pandas
      - run: python scripts/run_energy_risk_synthesis_v1.py
      - name: Commit evidence synthesis
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/energy_risk_synthesis_v1
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Run ENERGY-RISK-SYNTHESIS-007 [skip ci]"
          git pull --rebase origin main
          git push
