name: fed-cycle-total-risk-clock-v1

on:
  push:
    branches: [main]
    paths:
      - "research/FED_CYCLE_TOTAL_RISK_CLOCK_017_LOCK.md"
      - "scripts/run_fed_cycle_total_risk_clock_v1.py"
      - "results/fed_cycle_phase_clock_v1/PHASE_CYCLE_ASSET_METRICS.csv"
      - "results/fed_cycle_recovery_extension_v1/MARKET_RECOVERY_METRICS.csv"
      - "results/fed_cycle_recovery_extension_v1/HOUSING_RECOVERY_METRICS.csv"
      - "results/fed_cycle_supported_recovery_map_v1/SUPPORTED_RECOVERY_CELLS.csv"
      - ".github/workflows/fed-cycle-total-risk-clock-v1.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  total-clock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pandas numpy tabulate
      - run: python scripts/run_fed_cycle_total_risk_clock_v1.py
      - name: Commit total risk clock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/fed_cycle_total_risk_clock_v1
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Run FED-CYCLE-TOTAL-RISK-CLOCK-017 [skip ci]"
          git pull --rebase origin main
          git push
