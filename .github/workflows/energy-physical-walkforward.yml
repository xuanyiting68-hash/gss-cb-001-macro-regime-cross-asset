name: energy-physical-walkforward

on:
  push:
    branches: [main]
    paths:
      - "scripts/run_energy_physical_walkforward_v1_1.py"
      - "scripts/audit_energy_physical_wf_v1_1.py"
      - "research/ENERGY_PHYSICAL_WALKFORWARD_V1_LOCK.md"
      - "research/ENERGY_PHYSICAL_WF_001_V1_1_TIMING_AMENDMENT.md"
      - ".github/workflows/energy-physical-walkforward.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy scipy beautifulsoup4 xlrd tabulate

      - name: Run physical walk-forward
        run: python scripts/run_energy_physical_walkforward_v1_1.py

      - name: Run mechanism diagnostic
        run: python scripts/audit_energy_physical_wf_v1_1.py

      - name: Commit QC-passed public-safe outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/energy_physical_wf_v1_1/SOURCE_REGISTRY.csv
          git add results/energy_physical_wf_v1_1/RELEASE_DATE_REGISTRY.csv
          git add results/energy_physical_wf_v1_1/PHYSICAL_EVENT_PANEL.csv
          git add results/energy_physical_wf_v1_1/PRIMARY_DATA_ONLY_TESTS.csv
          git add results/energy_physical_wf_v1_1/QC.json
          git add results/energy_physical_wf_v1_1/DIAGNOSTIC_WITHIN_PRICE_CONFIRMED.csv
          git add results/energy_physical_wf_v1_1/DIAGNOSTIC_INVENTORY_COUNT.csv
          git add results/energy_physical_wf_v1_1/DIAGNOSTIC_PRICE_CONFIRMED_EVENTS.csv
          git add results/energy_physical_wf_v1_1/MECHANISM_DIAGNOSTIC.md
          git add results/energy_physical_wf_v1_1/ENERGY_PHYSICAL_WF_001_V1_1_REPORT.md
          if git diff --cached --quiet; then
            echo "No result changes"
            exit 0
          fi
          git commit -m "Run ENERGY-PHYSICAL-WF-001 v1.1 [skip ci]"
          git pull --rebase origin main
          git push
