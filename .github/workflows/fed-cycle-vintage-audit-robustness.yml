name: fed-cycle-vintage-audit-robustness

on:
  push:
    branches: [main]
    paths:
      - "scripts/audit_fed_cycle_vintage_v1_robustness.py"
      - "research/FED_CYCLE_VINTAGE_AUDIT_007_POSTRUN_ROBUSTNESS.md"
      - ".github/workflows/fed-cycle-vintage-audit-robustness.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy matplotlib tabulate
      - name: Run post-run vintage robustness audit
        run: python scripts/audit_fed_cycle_vintage_v1_robustness.py
      - name: Commit robustness outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/fed_cycle_vintage_audit_v1
          if git diff --cached --quiet; then
            echo "No robustness changes"
            exit 0
          fi
          git commit -m "Audit VINTAGE-007 post-run robustness [skip ci]"
          git pull --rebase origin main
          git push
