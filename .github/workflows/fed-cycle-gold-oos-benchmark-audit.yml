name: fed-cycle-gold-oos-benchmark-audit

on:
  push:
    branches: [main]
    paths:
      - "scripts/audit_fed_cycle_gold_oos_benchmarks.py"
      - "research/FED_CYCLE_GOLD_OOS_008_POSTRUN_BENCHMARK_AUDIT.md"
      - ".github/workflows/fed-cycle-gold-oos-benchmark-audit.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy tabulate
      - name: Run post-run benchmark sanity audit
        run: python scripts/audit_fed_cycle_gold_oos_benchmarks.py
      - name: Commit benchmark audit outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/fed_cycle_gold_oos_v1
          if git diff --cached --quiet; then
            echo "No benchmark audit changes"
            exit 0
          fi
          git commit -m "Audit OOS-008 benchmark sensitivity [skip ci]"
          git pull --rebase origin main
          git push
