name: energy-weekly-transition-v1

on:
  push:
    branches: [main]
    paths:
      - "research/ENERGY_WEEKLY_TRANSITION_011_LOCK.md"
      - "scripts/run_energy_weekly_transition_v1.py"
      - ".github/workflows/energy-weekly-transition-v1.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy scipy matplotlib beautifulsoup4 openpyxl xlrd tabulate
      - name: Run historical post-event transition diagnostic
        run: python scripts/run_energy_weekly_transition_v1.py
      - name: Commit transition diagnostic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/energy_weekly_transition_v1
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Run ENERGY-WEEKLY-TRANSITION-011 [skip ci]"
          git pull --rebase origin main
          git push
