name: fed-cycle-cross-asset-master-synthesis-v1
on:
  push:
    branches: [main]
    paths:
      - "research/FED_CYCLE_CROSS_ASSET_MASTER_SYNTHESIS_021_LOCK.md"
      - "scripts/run_fed_cycle_cross_asset_master_synthesis_v1.py"
      - "results/fed_cycle_phase_clock_v1/**"
      - "results/fed_cycle_stress_layer_v1/**"
      - "results/fed_cycle_asia_credit_diag_v1/**"
      - "results/fed_cycle_cross_asset_expansion_v1/**"
      - "results/fed_cycle_supported_recovery_map_v1/**"
      - "results/fed_cycle_total_risk_clock_v1/**"
      - ".github/workflows/fed-cycle-cross-asset-master-synthesis-v1.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  synthesize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pandas
      - run: python scripts/run_fed_cycle_cross_asset_master_synthesis_v1.py
      - name: Commit 021 outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/fed_cycle_cross_asset_master_synthesis_v1
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Run FED-CYCLE-CROSS-ASSET-MASTER-SYNTHESIS-021 [skip ci]"
          git pull --rebase origin main
          git push
