# frozen-input rerun 2026-09-27 v2
name: fed-cycle-cash-hurdle-real-return-map-040-pr-diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/fed-cycle-cash-hurdle-real-return-map-040-pr-diagnostic.yml"
      - "scripts/run_fed_cycle_cash_hurdle_real_return_map_040_v1.py"

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pandas numpy
      - run: python scripts/run_fed_cycle_cash_hurdle_real_return_map_040_v1.py
      - uses: actions/upload-artifact@v4
        with:
          name: cash-hurdle-040-output
          path: results/fed_cycle_cash_hurdle_real_return_map_040_v1
