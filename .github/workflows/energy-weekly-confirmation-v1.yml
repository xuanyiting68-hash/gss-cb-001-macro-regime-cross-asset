name: energy-weekly-confirmation-v1

on:
  push:
    branches: [main]
    paths:
      - "research/ENERGY_WEEKLY_CONFIRMATION_009_LOCK.md"
      - "scripts/run_energy_weekly_confirmation_v1.py"
      - ".github/workflows/energy-weekly-confirmation-v1.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  confirm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy scipy matplotlib beautifulsoup4 openpyxl xlrd
      - name: Update post-event physical confirmation path
        run: python scripts/run_energy_weekly_confirmation_v1.py
      - name: Commit confirmation path
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/energy_weekly_confirmation_v1
          if git diff --cached --quiet; then
            echo "No confirmation-state changes"
            exit 0
          fi
          git commit -m "Run ENERGY-WEEKLY-CONFIRMATION-009 [skip ci]"
          git pull --rebase origin main
          git push
