name: fed-cycle-listed-reit-proxy-bridge-036-v1
on:
  push:
    branches: [main]
    paths:
      - "research/FED_CYCLE_LISTED_REIT_PROXY_BRIDGE_036_LOCK.md"
      - "data/public/LISTED_REIT_PROXY_SOURCE_SPEC_20260926.csv"
      - "scripts/run_fed_cycle_listed_reit_proxy_bridge_036_v1.py"
      - "results/fed_cycle_cross_asset_expansion_v1/**"
      - "results/fed_cycle_four_phase_investor_atlas_032_v1/**"
      - ".github/workflows/fed-cycle-listed-reit-proxy-bridge-036-v1.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pandas numpy matplotlib scipy
      - run: python scripts/run_fed_cycle_listed_reit_proxy_bridge_036_v1.py
      - name: Commit 036 outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/fed_cycle_listed_reit_proxy_bridge_036_v1
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Run FED-CYCLE-LISTED-REIT-PROXY-BRIDGE-036 [skip ci]"
          git pull --rebase origin main
          git push
