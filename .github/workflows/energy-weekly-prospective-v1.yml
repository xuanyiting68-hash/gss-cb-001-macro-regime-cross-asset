name: energy-weekly-prospective-v1

on:
  push:
    branches: [main]
    paths:
      - "research/ENERGY_WEEKLY_PROSPECTIVE_005_LOCK.md"
      - "scripts/run_energy_weekly_prospective_v1.py"
      - "results/energy_weekly_state_v1/SELECTED_EVENT_PANEL.csv"
      - "results/energy_weekly_state_v1/QC.json"
      - ".github/workflows/energy-weekly-prospective-v1.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  register-live-events:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy
      - name: Register still-unrealized strict-PIT events
        run: python scripts/run_energy_weekly_prospective_v1.py
      - name: Commit append-only prospective registry
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/energy_weekly_prospective_v1
          if git diff --cached --quiet; then
            echo "No prospective energy registry changes"
            exit 0
          fi
          git commit -m "Run ENERGY-WEEKLY-PROSPECTIVE-005 [skip ci]"
          git pull --rebase origin main
          git push
