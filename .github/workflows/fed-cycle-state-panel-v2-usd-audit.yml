name: fed-cycle-state-panel-v2-usd-audit

on:
  push:
    branches: [main]
    paths:
      - "scripts/audit_fed_cycle_state_panel_v2_usd.py"
      - "research/FED_CYCLE_STATE_PANEL_002_USD_DIAGNOSTIC.md"
      - ".github/workflows/fed-cycle-state-panel-v2-usd-audit.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy matplotlib tabulate

      - name: Run USD secondary audit
        run: python scripts/audit_fed_cycle_state_panel_v2_usd.py

      - name: Commit QC-passed diagnostic outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/fed_cycle_state_panel_v2
          if git diff --cached --quiet; then
            echo "No USD diagnostic changes"
            exit 0
          fi
          git commit -m "Audit STATE-PANEL-002 USD secondary [skip ci]"
          git pull --rebase origin main
          git push
