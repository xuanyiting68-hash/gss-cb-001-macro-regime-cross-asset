name: fed-cycle-prospective-gcf-v1

on:
  push:
    branches: [main]
    paths:
      - "scripts/run_fed_cycle_prospective_gcf_v1.py"
      - "research/FED_CYCLE_PROSPECTIVE_GCF_012_LOCK.md"
      - "results/fed_cycle_gold_live_bridge_v1/QC.json"
      - "results/fed_cycle_gold_oos_v1/OOS_FEATURE_PANEL.csv"
      - ".github/workflows/fed-cycle-prospective-gcf-v1.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy
      - name: Freeze proxy-measurement prospective model
        run: python scripts/run_fed_cycle_prospective_gcf_v1.py
      - name: Commit QC-passed frozen model artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/fed_cycle_prospective_gcf_v1
          if git diff --cached --quiet; then
            echo "No prospective GCF artifact changes"
            exit 0
          fi
          git commit -m "Run FED-CYCLE-PROSPECTIVE-GCF-012 [skip ci]"
          git pull --rebase origin main
          git push
