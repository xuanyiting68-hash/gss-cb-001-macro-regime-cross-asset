name: fed-cycle-prospective-issuance-v1

on:
  push:
    branches: [main]
    paths:
      - "scripts/run_fed_cycle_prospective_issuance_v1.py"
      - "research/FED_CYCLE_PROSPECTIVE_ISSUANCE_013_LOCK.md"
      - "results/fed_cycle_prospective_gcf_v1/MODEL_SPEC.json"
      - "results/fed_cycle_prospective_gcf_v1/FROZEN_TRAINING_MODEL.json"
      - "results/fed_cycle_path_v1_1/FED_POLICY_CHANGE_REGISTRY.csv"
      - ".github/workflows/fed-cycle-prospective-issuance-v1.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  issue-or-refuse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy matplotlib beautifulsoup4 openpyxl
      - name: Run frozen append-only issuance gate
        run: python scripts/run_fed_cycle_prospective_issuance_v1.py
      - name: Commit issuance state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/fed_cycle_prospective_gcf_v1/PREDICTION_REGISTRY.csv
          git add results/fed_cycle_prospective_gcf_v1/ISSUANCE_READINESS.csv
          git add results/fed_cycle_prospective_gcf_v1/ISSUANCE_QC.json
          git add results/fed_cycle_prospective_gcf_v1/ISSUANCE_STATUS.md
          if git diff --cached --quiet; then
            echo "No issuance state changes"
            exit 0
          fi
          git commit -m "Run FED-CYCLE-PROSPECTIVE-ISSUANCE-013 [skip ci]"
          git pull --rebase origin main
          git push
