name: fed-cycle-cross-asset-risk-clock-v1

on:
  push:
    branches: [main]
    paths:
      - "scripts/run_fed_cycle_cross_asset_risk_clock_v1.py"
      - "research/FED_CYCLE_CROSS_ASSET_RISK_CLOCK_003_LOCK.md"
      - ".github/workflows/fed-cycle-cross-asset-risk-clock-v1.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy matplotlib tabulate beautifulsoup4

      - name: Run frozen cross-asset risk clock
        run: python scripts/run_fed_cycle_cross_asset_risk_clock_v1.py

      - name: Commit QC-passed public-safe risk-clock outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/fed_cycle_risk_clock_v1
          if git diff --cached --quiet; then
            echo "No risk-clock result changes"
            exit 0
          fi
          git commit -m "Run FED-CYCLE-CROSS-ASSET-RISK-CLOCK-003 [skip ci]"
          git pull --rebase origin main
          git push
