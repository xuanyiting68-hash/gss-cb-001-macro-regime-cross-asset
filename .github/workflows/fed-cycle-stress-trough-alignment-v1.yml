name: fed-cycle-stress-trough-alignment-v1

on:
  push:
    branches: [main]
    paths:
      - "research/FED_CYCLE_STRESS_TROUGH_ALIGNMENT_018_LOCK.md"
      - "scripts/run_fed_cycle_stress_trough_alignment_v1.py"
      - "results/fed_cycle_phase_clock_v1/PHASE_CYCLE_ASSET_METRICS.csv"
      - "results/fed_cycle_stress_layer_v1/STRESS_CYCLE_PHASE_METRICS.csv"
      - ".github/workflows/fed-cycle-stress-trough-alignment-v1.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pandas numpy tabulate
      - run: python scripts/run_fed_cycle_stress_trough_alignment_v1.py
      - name: Commit stress/trough alignment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/fed_cycle_stress_trough_alignment_v1
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Run FED-CYCLE-STRESS-TROUGH-ALIGNMENT-018 [skip ci]"
          git pull --rebase origin main
          git push
