name: fed-cycle-path-v1-1

on:
  push:
    branches: [main]
    paths:
      - "scripts/run_fed_cycle_path_v1_1.py"
      - "research/FED_CYCLE_PATH_001_V1_1_TIMING_LOCK.md"
      - ".github/workflows/fed-cycle-path-v1-1.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy matplotlib beautifulsoup4 tabulate

      - name: Run timing-corrected Fed-cycle path-risk foundation
        run: python scripts/run_fed_cycle_path_v1_1.py

      - name: Commit QC-passed public-safe outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/fed_cycle_path_v1_1
          if git diff --cached --quiet; then
            echo "No result changes"
            exit 0
          fi
          git commit -m "Run FED-CYCLE-PATH-001 v1.1 [skip ci]"
          git pull --rebase origin main
          git push
