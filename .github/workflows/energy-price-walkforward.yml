name: energy-price-walkforward

on:
  push:
    branches: [main]
    paths:
      - "scripts/run_energy_price_walkforward.py"
      - "research/ENERGY_PRICE_WALKFORWARD_V1_LOCK.md"
      - ".github/workflows/energy-price-walkforward.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy scipy matplotlib tabulate

      - name: Run frozen walk-forward
        run: python scripts/run_energy_price_walkforward.py

      - name: Commit QC-passed public-safe outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/energy_price_wf_v1/SOURCE_REGISTRY.csv
          git add results/energy_price_wf_v1/EVENTS.csv
          git add results/energy_price_wf_v1/GROUP_DESCRIPTIVES.csv
          git add results/energy_price_wf_v1/PRIMARY_TESTS.csv
          git add results/energy_price_wf_v1/SIMPLE_WTI_ROLLOVER_BENCHMARK.csv
          git add results/energy_price_wf_v1/QC.json
          git add results/energy_price_wf_v1/ENERGY_PRICE_WF_001_REPORT.md
          git add results/energy_price_wf_v1/01_event_wti_3m_returns.png
          git add results/energy_price_wf_v1/02_confirmed_vs_veto_medians.png
          if git diff --cached --quiet; then
            echo "No result changes"
            exit 0
          fi
          git commit -m "Run ENERGY-PRICE-WF-001 [skip ci]"
          git push
