name: fed-cycle-four-phase-investor-atlas-032-v1
on:
  push:
    branches: [main]
    paths:
      - "research/FED_CYCLE_FOUR_PHASE_INVESTOR_ATLAS_032_LOCK.md"
      - "scripts/run_fed_cycle_four_phase_investor_atlas_032_v1.py"
      - "results/fed_cycle_cross_asset_master_synthesis_v1/**"
      - "results/fed_cycle_precut_state_v1/**"
      - "results/fed_cycle_precut_stress_level_v1/**"
      - ".github/workflows/fed-cycle-four-phase-investor-atlas-032-v1.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pandas
      - run: python scripts/run_fed_cycle_four_phase_investor_atlas_032_v1.py
      - name: Commit 032 outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/fed_cycle_four_phase_investor_atlas_032_v1
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Run FED-CYCLE-FOUR-PHASE-INVESTOR-ATLAS-032 [skip ci]"
          git pull --rebase origin main
          git push
