name: fed-cycle-gold-longhist-monthly-survival

on:
  push:
    branches: [main]
    paths:
      - "scripts/audit_fed_cycle_gold_longhist_monthly_survival.py"
      - "research/FED_CYCLE_GOLD_LONGHIST_MONTHLY_001_RECOVERY_AMENDMENT.md"
      - ".github/workflows/fed-cycle-gold-longhist-monthly-survival.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy matplotlib tabulate

      - name: Run censoring-aware recovery survival audit
        run: python scripts/audit_fed_cycle_gold_longhist_monthly_survival.py

      - name: Commit QC-passed public-safe survival outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/gold_long_history_monthly_v1
          if git diff --cached --quiet; then
            echo "No survival result changes"
            exit 0
          fi
          git commit -m "Audit Gold recovery survival [skip ci]"
          git pull --rebase origin main
          git push
