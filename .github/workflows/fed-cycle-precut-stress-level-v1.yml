name: fed-cycle-precut-stress-level-v1
on:
  push:
    branches: [main]
    paths:
      - "research/FED_CYCLE_PRECUT_STRESS_LEVEL_020_LOCK.md"
      - "scripts/run_fed_cycle_precut_stress_level_v1.py"
      - "results/fed_cycle_precut_state_v1/PRECUT_STATE_CYCLE_PANEL.csv"
      - "results/fed_cycle_stress_layer_v1/STRESS_CYCLE_PHASE_METRICS.csv"
      - ".github/workflows/fed-cycle-precut-stress-level-v1.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pandas numpy tabulate
      - run: python scripts/run_fed_cycle_precut_stress_level_v1.py
      - name: Commit 020 outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/fed_cycle_precut_stress_level_v1
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Run FED-CYCLE-PRECUT-STRESS-LEVEL-020 [skip ci]"
          git pull --rebase origin main
          git push
