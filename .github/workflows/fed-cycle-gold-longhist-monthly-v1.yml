name: fed-cycle-gold-longhist-monthly-v1

on:
  push:
    branches: [main]
    paths:
      - "scripts/run_fed_cycle_gold_longhist_monthly_v1.py"
      - "research/FED_CYCLE_GOLD_LONGHIST_MONTHLY_001_LOCK.md"
      - ".github/workflows/fed-cycle-gold-longhist-monthly-v1.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy matplotlib tabulate

      - name: Run frozen long-history monthly Gold layer
        run: python scripts/run_fed_cycle_gold_longhist_monthly_v1.py

      - name: Commit QC-passed public-safe outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/gold_long_history_monthly_v1
          if git diff --cached --quiet; then
            echo "No result changes"
            exit 0
          fi
          git commit -m "Run FED-CYCLE-GOLD-LONGHIST-MONTHLY-001 [skip ci]"
          git pull --rebase origin main
          git push
