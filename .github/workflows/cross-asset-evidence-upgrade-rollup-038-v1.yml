name: cross-asset-evidence-upgrade-rollup-038-v1
on:
  push:
    branches: [main]
    paths:
      - "research/CROSS_ASSET_EVIDENCE_UPGRADE_ROLLUP_038_LOCK.md"
      - "scripts/run_cross_asset_evidence_upgrade_rollup_038_v1.py"
      - "results/fed_cycle_four_phase_investor_atlas_032_v1/**"
      - "results/fed_cycle_gold_mechanism_decomposition_033_v1/**"
      - "results/fed_cycle_housing_lag_chain_034_v1/**"
      - "results/fed_cycle_long_treasury_proxy_bridge_035_v1/**"
      - "results/fed_cycle_listed_reit_proxy_bridge_036_v1/**"
      - "results/fed_cycle_reit_deep_history_dual_bridge_037_v1/**"
      - ".github/workflows/cross-asset-evidence-upgrade-rollup-038-v1.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pandas
      - run: python scripts/run_cross_asset_evidence_upgrade_rollup_038_v1.py
      - name: Commit 038 outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/cross_asset_evidence_upgrade_rollup_038_v1
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Run CROSS-ASSET-EVIDENCE-UPGRADE-ROLLUP-038 [skip ci]"
          git pull --rebase origin main
          git push
