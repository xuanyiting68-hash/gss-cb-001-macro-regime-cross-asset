name: energy-weekly-veto-diagnostic-v1

on:
  push:
    branches: [main]
    paths:
      - "research/ENERGY_WEEKLY_STATE_004A_POSTRUN_DIAGNOSTIC.md"
      - "scripts/run_energy_weekly_veto_diagnostic_v1.py"
      - ".github/workflows/energy-weekly-veto-diagnostic-v1.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pandas numpy tabulate
      - run: python scripts/run_energy_weekly_veto_diagnostic_v1.py
      - name: Commit diagnostic outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/energy_weekly_state_veto_diag_v1
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Run ENERGY-WEEKLY-STATE-004A [skip ci]"
          git pull --rebase origin main
          git push
