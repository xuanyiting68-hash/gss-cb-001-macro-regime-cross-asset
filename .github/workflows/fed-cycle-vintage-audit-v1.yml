name: fed-cycle-vintage-audit-v1

on:
  push:
    branches: [main]
    paths:
      - "scripts/run_fed_cycle_vintage_audit_v1.py"
      - "research/FED_CYCLE_VINTAGE_AUDIT_007_LOCK.md"
      - ".github/workflows/fed-cycle-vintage-audit-v1.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy matplotlib tabulate beautifulsoup4 openpyxl
      - name: Run frozen real-time vintage audit
        run: python scripts/run_fed_cycle_vintage_audit_v1.py
      - name: Commit QC-passed vintage audit outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/fed_cycle_vintage_audit_v1
          if git diff --cached --quiet; then
            echo "No vintage audit changes"
            exit 0
          fi
          git commit -m "Run FED-CYCLE-VINTAGE-AUDIT-007 [skip ci]"
          git pull --rebase origin main
          git push
