name: fed-cycle-cnt02-final-publishing-rc-031-v1
on:
  push:
    branches: [main]
    paths:
      - "research/FED_CYCLE_CNT02_FINAL_PUBLISHING_RC_031_LOCK.md"
      - "scripts/run_fed_cycle_cnt02_final_publishing_rc_031_v1.py"
      - "results/fed_cycle_release_preflight_030_v1/**"
      - "results/fed_cycle_editorial_release_candidate_029_v1/**"
      - "results/fed_cycle_platform_native_production_pack_028_v1/**"
      - "results/fed_cycle_content_claim_registry_022b_v1/**"
      - ".github/workflows/fed-cycle-cnt02-final-publishing-rc-031-v1.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pandas
      - run: python scripts/run_fed_cycle_cnt02_final_publishing_rc_031_v1.py
      - name: Commit 031 outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/fed_cycle_cnt02_final_publishing_rc_031_v1
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Run FED-CYCLE-CNT02-FINAL-PUBLISHING-RC-031 [skip ci]"
          git pull --rebase origin main
          git push
