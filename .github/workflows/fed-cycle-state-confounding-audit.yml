name: fed-cycle-state-confounding-audit

on:
  push:
    branches: [main]
    paths:
      - "scripts/audit_fed_cycle_state_confounding.py"
      - "research/FED_CYCLE_STATE_001_CONFOUNDING_DIAGNOSTIC.md"
      - ".github/workflows/fed-cycle-state-confounding-audit.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy tabulate

      - name: Run state confounding diagnostic
        run: python scripts/audit_fed_cycle_state_confounding.py

      - name: Commit QC-passed diagnostic outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/fed_cycle_state_v1
          if git diff --cached --quiet; then
            echo "No diagnostic result changes"
            exit 0
          fi
          git commit -m "Audit FED-CYCLE-STATE-001 confounding [skip ci]"
          git pull --rebase origin main
          git push
