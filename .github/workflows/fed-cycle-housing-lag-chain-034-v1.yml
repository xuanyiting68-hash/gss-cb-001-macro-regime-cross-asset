name: fed-cycle-housing-lag-chain-034-v1
on:
  push:
    branches: [main]
    paths:
      - "research/FED_CYCLE_HOUSING_LAG_CHAIN_034_LOCK.md"
      - "data/public/HOUSING_LAG_CHAIN_SOURCE_SPEC_20260926.csv"
      - "scripts/run_fed_cycle_housing_lag_chain_034_v1.py"
      - "results/fed_cycle_cross_asset_expansion_v1/**"
      - "results/fed_cycle_recovery_extension_v1/**"
      - "results/fed_cycle_four_phase_investor_atlas_032_v1/**"
      - ".github/workflows/fed-cycle-housing-lag-chain-034-v1.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pandas numpy
      - run: python scripts/run_fed_cycle_housing_lag_chain_034_v1.py
      - name: Commit 034 outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/fed_cycle_housing_lag_chain_034_v1
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Run FED-CYCLE-HOUSING-LAG-CHAIN-034 [skip ci]"
          git pull --rebase origin main
          git push
