name: fed-cycle-figure-registry-024-v1
on:
  push:
    branches: [main]
    paths:
      - "research/FED_CYCLE_FIGURE_REGISTRY_024_LOCK.md"
      - "scripts/run_fed_cycle_figure_registry_024_v1.py"
      - "results/fed_cycle_content_claim_registry_022b_v1/**"
      - "results/fed_cycle_realtime_regime_dashboard_v1/**"
      - ".github/workflows/fed-cycle-figure-registry-024-v1.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pandas
      - run: python scripts/run_fed_cycle_figure_registry_024_v1.py
      - name: Commit 024 outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/fed_cycle_figure_registry_024_v1
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Run FED-CYCLE-FIGURE-REGISTRY-024 [skip ci]"
          git pull --rebase origin main
          git push
