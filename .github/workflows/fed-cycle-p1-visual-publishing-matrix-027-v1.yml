name: fed-cycle-p1-visual-publishing-matrix-027-v1
on:
  push:
    branches: [main]
    paths:
      - "research/FED_CYCLE_P1_VISUAL_PUBLISHING_MATRIX_027_LOCK.md"
      - "scripts/run_fed_cycle_p1_visual_publishing_matrix_027_v1.py"
      - "results/fed_cycle_figure_registry_024_v1/**"
      - "results/fed_cycle_p0_visual_evidence_pack_v1/**"
      - "results/fed_cycle_content_production_library_026_v1/**"
      - "results/fed_cycle_content_claim_registry_022b_v1/**"
      - "results/fed_cycle_historical_casebook_v1/**"
      - "results/fed_cycle_historical_context_022a_v1/**"
      - ".github/workflows/fed-cycle-p1-visual-publishing-matrix-027-v1.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pandas matplotlib pillow
      - run: python scripts/run_fed_cycle_p1_visual_publishing_matrix_027_v1.py
      - name: Commit 027 outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/fed_cycle_p1_visual_publishing_matrix_027_v1
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Run FED-CYCLE-P1-VISUAL-PUBLISHING-MATRIX-027 [skip ci]"
          git pull --rebase origin main
          git push
