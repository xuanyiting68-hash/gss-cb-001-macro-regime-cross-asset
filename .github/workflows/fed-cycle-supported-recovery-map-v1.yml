name: fed-cycle-supported-recovery-map-v1

on:
  push:
    branches: [main]
    paths:
      - "research/FED_CYCLE_SUPPORTED_RECOVERY_MAP_016_LOCK.md"
      - "scripts/run_fed_cycle_supported_recovery_map_v1.py"
      - "results/fed_cycle_phase_clock_v1/PHASE_RECOVERY_SUMMARY.csv"
      - "results/fed_cycle_recovery_extension_v1/MARKET_RECOVERY_SUMMARY.csv"
      - "results/fed_cycle_recovery_extension_v1/HOUSING_RECOVERY_SUMMARY.csv"
      - ".github/workflows/fed-cycle-supported-recovery-map-v1.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  synthesize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pandas numpy tabulate
      - run: python scripts/run_fed_cycle_supported_recovery_map_v1.py
      - name: Commit recovery synthesis
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/fed_cycle_supported_recovery_map_v1
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Run FED-CYCLE-SUPPORTED-RECOVERY-MAP-016 [skip ci]"
          git pull --rebase origin main
          git push
