name: fed-cycle-vintage-event-contrast

on:
  push:
    branches: [main]
    paths:
      - "scripts/audit_fed_cycle_vintage_event_contrast.py"
      - "research/FED_CYCLE_VINTAGE_AUDIT_007_EVENT_CONTRAST_IMPACT.md"
      - ".github/workflows/fed-cycle-vintage-event-contrast.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy tabulate
      - name: Run event contrast impact audit
        run: python scripts/audit_fed_cycle_vintage_event_contrast.py
      - name: Commit QC-passed impact outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/fed_cycle_vintage_audit_v1
          if git diff --cached --quiet; then
            echo "No event contrast changes"
            exit 0
          fi
          git commit -m "Audit VINTAGE-007 event contrast impact [skip ci]"
          git pull --rebase origin main
          git push
